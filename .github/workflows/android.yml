name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: App and server tests, lint, benchmark compile, and release artifacts
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :server:test
          :app:lintDebug
          :app:lintRelease
          :benchmark:assembleBenchmarkRelease
          :app:assembleDebug
          :app:assembleRelease
          :app:bundleRelease
          --stacktrace
